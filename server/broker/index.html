<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Elffuss · broker de modelos</title>
<meta name="robots" content="noindex">
<style>body{margin:0;background:#090a11;color:#8b929c;font:13px system-ui;display:grid;place-items:center;height:100vh}</style>
</head><body>
<div>Elffuss · caché compartida de modelos. Esta página no se usa directamente.</div>
<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// BROKER DE MODELOS · caché OPFS compartida entre todas las webs de Elffuss.
// Se embebe como iframe oculto desde cada propiedad (claw/translator/copilot/…).
// Como todas son subdominios de utopiaia.com (mismo «site»), este iframe es
// first-party en todas y comparte UNA sola OPFS → el modelo se descarga UNA vez
// y se reutiliza en todas. (Un tercero que lo integre tiene su propia partición
// por privacidad del navegador: se baja una vez POR SU site.)
// API postMessage: {type:'elffuss-model-get', id, url} → progress* → begin →
// chunk* (ArrayBuffer transferible) → end | error.  {type:'elffuss-model-has',id,url}
// ─────────────────────────────────────────────────────────────────────────────
const DIR = 'elffuss-models';
const CHUNK = 8 * 1024 * 1024;
// Orígenes permitidos: todo *.utopiaia.com. Las integraciones de terceros se
// añaden por query (?allow=https://otra.com) — cada una en su propia partición.
const extra = new URLSearchParams(location.search).getAll('allow');
function allowed(origin) {
  if (/^https:\/\/([\w-]+\.)*utopiaia\.com$/.test(origin)) return true;
  if (/^http:\/\/localhost(:\d+)?$/.test(origin)) return true;     // desarrollo
  return extra.includes(origin);
}
const keyFor = u => String(u).replace(/[?#].*$/, '').replace(/[^\w.\-]+/g, '_').slice(-180);
async function requestPersist(){ try{ if(navigator.storage?.persist){ return (await navigator.storage.persisted?.()) || await navigator.storage.persist(); } }catch{} return false; }
async function dir(){ const root = await navigator.storage.getDirectory(); return root.getDirectoryHandle(DIR, { create:true }); }

async function cachedFile(url){
  try{ const d = await dir(); const k = keyFor(url);
    const marca = JSON.parse(await (await (await d.getFileHandle(k + '.done')).getFile()).text());
    const f = await juntar(d, k, marca.parts || 1);
    // El tamaño tiene que cuadrar con el apuntado: un fichero truncado por un
    // desalojo se lee sin error y el modelo saldría con basura dentro.
    return (f.size > 0 && (!marca.size || f.size === marca.size)) ? f : null;
  }catch{ return null; }
}
async function juntar(d, k, n){
  const partes = [];
  for (let i = 0; i < n; i++) partes.push(await (await d.getFileHandle(k + '.p' + i)).getFile());
  return partes.length === 1 ? partes[0] : new Blob(partes);
}
async function downloadToOPFS(url, onProgress){
  await requestPersist();
  const d = await dir(); const k = keyFor(url);
  const net = await fetch(url);
  if (!net.ok || !net.body) throw new Error('descarga falló: HTTP ' + net.status);
  const total = +net.headers.get('content-length') || 0;
  await d.removeEntry(k + '.done').catch(()=>{});
  // TROCEADO en partes de 1 GiB. Un fichero suelto lo corta el navegador sobre
  // los 1,94 GB —medido— pase lo que pase con la cuota, así que un modelo de
  // 3,8 GB era IMPOSIBLE de cachear aquí y fallaba con «exceed its storage
  // quota», que despista porque suena a falta de espacio y no lo es.
  const PARTE = 1024 * 1024 * 1024;
  let nPartes = 0, enParte = 0, w = null;
  const abrirParte = async () => {
    const fh = await d.getFileHandle(k + '.p' + nPartes, { create:true });
    w = await fh.createWritable(); nPartes++; enParte = 0;
  };
  let loaded = 0; const reader = net.body.getReader();
  try{
    await abrirParte();
    for(;;){ const { done, value } = await reader.read(); if (done) break;
      // Un trozo de red no respeta la frontera de parte: se reparte.
      let off = 0;
      while (off < value.byteLength) {
        if (enParte >= PARTE) { await w.close(); await abrirParte(); }
        const cabe = Math.min(PARTE - enParte, value.byteLength - off);
        await w.write(value.subarray(off, off + cabe));
        off += cabe; enParte += cabe; loaded += cabe;
      }
      onProgress?.({ loaded, total }); }
    await w.close(); w = null;
  }catch(e){
    // El motivo se GUARDA, no solo se lanza: desde fuera «no está cacheado» y
    // «falló al cachear» se ven igual, y llevan a sitios opuestos. Nos costó
    // media investigación no poder distinguirlos.
    try { const eh = await d.getFileHandle('.ultimo-error', { create:true });
          const ew = await eh.createWritable();
          await ew.write(new TextEncoder().encode(String(e && e.message || e).slice(0,200)));
          await ew.close(); } catch {}
    try{ await w.abort(); }catch{} await d.removeEntry(k).catch(()=>{}); throw e; }
  const dh = await d.getFileHandle(k + '.done', { create:true }); const dw = await dh.createWritable();
  await dw.write(new TextEncoder().encode(JSON.stringify({ size: loaded, parts: nPartes }))); await dw.close();
  return await juntar(d, k, nPartes);
}

let inflight = new Map();   // url → Promise<File> (colapsa descargas simultáneas)
async function getFile(url, onProgress){
  const hit = await cachedFile(url); if (hit) return hit;
  if (inflight.has(url)) return inflight.get(url);
  const p = downloadToOPFS(url, onProgress).finally(()=> inflight.delete(url));
  inflight.set(url, p); return p;
}

addEventListener('message', async e => {
  if (!allowed(e.origin)) return;
  const d = e.data || {}; const { type, id, url } = d;
  const post = (msg, transfer) => { try{ e.source.postMessage({ id, ...msg }, e.origin, transfer || []); }catch{} };
  if (e.data?.type === 'elffuss-broker-diag') {
      // Diagnóstico: qué hay REALMENTE en MI almacén. Sin esto, «no está
      // cacheado» y «no puedo verlo desde aquí» son indistinguibles desde
      // fuera, y llevan a sitios opuestos.
      let ficheros = [], est = null, err = null, escritura = null;
      // Intento de escritura REAL: crear el fichero no demuestra nada, hay que
      // ver si los bytes llegan. Aquí es donde se rompía en silencio.
      try {
        const root0 = await navigator.storage.getDirectory();
        const d0 = await root0.getDirectoryHandle(DIR, { create: true });
        // Cuánto admite DE VERDAD este contexto. La cuota anunciada miente:
        // dice gigabytes y luego revienta mucho antes. Se escribe hasta que
        // falla, en trozos de 64 MiB, con un tope para no tardar una eternidad.
        const tope = (e.data.probar || 0) * 1048576;
        if (tope) {
          const ph = await d0.getFileHandle('.techo-test', { create: true });
          const pw = await ph.createWritable();
          const bloque = new Uint8Array(64 * 1048576);
          let n = 0;
          try { while (n < tope) { await pw.write(bloque); n += bloque.length; } await pw.close(); }
          catch (x) { try { await pw.abort(); } catch {} }
          escritura = 'techo real: ' + (n / 1048576).toFixed(0) + ' MiB de ' + (tope / 1048576) + ' intentados';
          await d0.removeEntry('.techo-test').catch(() => {});
          e.source.postMessage({ id: e.data.id, kind: 'diag', escritura, quota: (await navigator.storage.estimate()).quota }, e.origin);
          return;
        }
        const fh = await d0.getFileHandle('.escritura-test', { create: true });
        if (typeof fh.createWritable !== 'function') escritura = 'sin createWritable en este contexto';
        else {
          const w = await fh.createWritable();
          await w.write(new Uint8Array(1024));
          await w.close();
          escritura = 'escritos ' + (await fh.getFile()).size + ' de 1024 bytes';
        }
        await d0.removeEntry('.escritura-test').catch(() => {});
      } catch (x) { escritura = 'ERROR: ' + String(x.message || x).slice(0, 110); }
      try {
        est = await navigator.storage.estimate();
        const root = await navigator.storage.getDirectory();
        const d = await root.getDirectoryHandle(DIR, { create: true });
        for await (const [n, h] of d.entries()) {
          ficheros.push(n + (h.kind === 'file' ? ':' + (await h.getFile()).size : '/'));
        }
      } catch (x) { err = String(x.message || x).slice(0, 90); }
      e.source.postMessage({ id: e.data.id, kind: 'diag', origen: location.origin,
                             ficheros, quota: est?.quota, usado: est?.usage, err, escritura }, e.origin);
      return;
    }
    if (type === 'elffuss-model-has') {
    const f = await cachedFile(url); post({ kind:'has', cached: !!f, size: f?f.size:0 }); return;
  }
  if (type === 'elffuss-model-get') {
    try{
      const file = await getFile(url, p => post({ kind:'progress', ...p }));
      // El File de OPFS es un Blob respaldado en DISCO: structured-clone lo pasa
      // POR REFERENCIA (Chromium: vive en el proceso de navegador, ref-contado,
      // paginado a disco) → NO copia los GB a la RAM de ningún renderer. El padre
      // lo lee perezosamente con file.stream(). Mantener este iframe vivo mientras
      // el padre lee (el Blob vivo mantiene referenciados los datos en OPFS).
      post({ kind:'file', file });
    }catch(err){ post({ kind:'error', message: String(err?.message || err) }); }
  }
});
// avisar a quien nos embebe que estamos listos
try{ parent.postMessage({ kind:'elffuss-broker-ready' }, '*'); }catch{}
</script>
</body></html>
